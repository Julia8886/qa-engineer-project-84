---
- summary: |
     Оформление заказа не авторизованным пользователем 
    requirement: |
      Успешное оформление заказа без авторизации в системе.
    prerequisites: |
    - Оформить заказ на сайте
    test-data: |
    - Заказ успешно создан и отправлен
    steps: 
       - Перейти к оформлению заказа. 
       - Оставить поле "Телефон" пустым.
       - Нажимаем кнопку "Подтвердить заказ".
    expected-result: |
      Заказ не оформлен, поле «Телефон» подсвечено красным с текстом
    «Обязательно для заполнения».
- summary: |
      Оформление заказа авторизованным пользователем
    requirement: |
      Успешное оформление заказа авторизованным пользователем
    prerequisites: |
      - Пользователь зарегистрирован в системе в корзину добавлен один товар
    test-data: |
      - Заказ успешно оплачен 
    steps: 
       - Перейти к оформлению заказа. 
       - Выбрать способ оплаты и доставки
       - Нажимаем кнопку "Подтвердить заказ".
    expected-result: |
      Заказ успешно создан, отображается номер заказа "Спасибо за заказ".
- summary: |
      Поиск товара по неполному названию
    requirement: |
      Успешное отображение товаров в результатах поиска по части слова.
    prerequisites: |
      В базе данных сайта зарегистрированы товары с именем "кофемашина".
    test-data: |
      - Поисковый запрос(неполное название)кофе.
    steps: 
       - Ввести в строку поиска "Кофе" без нажатия кнопки поиск (при наличии
    товара в магазине). 
       - Нажать клавишу "Enter" на клавиатуре 
       - Проверить корректность отображаемой выдачи
    expected-result: |
       Отображается список товаров, содержащих в названии или описании корень "Кофе"
- summary: |
      Изменение количества товара в корзине
    requirement: |
      Изменение количества товара кнопками "+" "-" и путём ручного ввода в поле.
    prerequisites: |
      В корзину добавлен один товар(остаток на складе 10 шт.)
    test-data: |
      - Товар(наименование, цена за 1 шт:150 руб.)
    steps: 
       - Перейти в корзину. 
       - Нажать на кнопку "+" увеличить количество товара.
       - Нажать на кнопку "-" уменьшить количество товара. 
       - Убедиться что количество изменено и новая сумма сохранились в корзине.
    expected-result: >
      Количество товара изменилось ,итоговая сумма заказа
    автоматически пересчиталась.
- summary: |
      Сортировка товаров по цене (от меньшей к большей)
    requirement: |
      Проверка сортировки товаров по цене от дешёвых к дорогим.
    prerequisites: >
      В корзину добавлен товар (Кофе) и отображается несколько товаров
    с разной стоимостью.
    test-data: |
       - Наименование,цена от 150 до 5000 руб.
    steps: 
       - Открыть категорию "Напитки" 
       - Выбрать сортировку (сначала дешевые)
       - Выбрать сортировку (сначала дорогие)
    expected-result: |
      Первым выводится самый дешевый товар, далее цена идёт по возрастанию.


      
