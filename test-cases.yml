---
- summary: |
    Проверка отображения карточки товара со скидкой в каталоге
  requirement: |
    На странице товара и в каталоге нужно выводить название, рейтинг, цену со скидкой и без нее
  prerequisites: |
    В базе данных есть товар с активной скидкой. Открыта страница каталога товаров.
  test-data: |
    Товар ID 101 (Название: "Смартфон X", Рейтинг: 4.8, Цена без скидки: 50000, Цена со скидкой: 45000)
  steps:
    - Найти в каталоге товар ID 101
    - Визуально проверить отображаемые элементы на карточке товара
  expected-result: |
    На карточке товара отображаются: название "Смартфон X", рейтинг "4.8", зачеркнутая старая цена "50 000" и актуальная цена "45 000"

- summary: |
    Проверка отображения карточки товара без скидки в каталоге
  requirement: |
    На странице товара и в каталоге нужно выводить название, рейтинг, цену со скидкой и без нее
  prerequisites: |
    В базе данных есть товар без скидки. Открыта страница каталога товаров.
  test-data: |
    Товар ID 102 (Название: "Наушники Y", Рейтинг: 4.2, Цена: 5000)
  steps:
    - Найти в каталоге товар ID 102
    - Визуально проверить отображаемые элементы на карточке товара
  expected-result: |
    На карточке товара отображаются: название "Наушники Y", рейтинг "4.2", актуальная цена "5 000". Зачеркнутая старая цена отсутствует.

- summary: |
    Проверка фильтрации товаров по категории
  requirement: |
    В каталоге должна работать фильтрация товаров по категории
  prerequisites: |
    Открыта страница каталога товаров с полным ассортиментом.
  test-data: |
    Категория = "Электроника"
  steps:
    - Перейти в блок фильтров
    - Выбрать категорию "Электроника"
    - Нажать кнопку применения фильтра (если применимо) или дождаться автообновления
  expected-result: |
    Список товаров обновился. В выдаче присутствуют только товары из категории "Электроника"

- summary: |
    Проверка фильтрации товаров по производителю
  requirement: |
    В каталоге должна работать фильтрация товаров по производителю
  prerequisites: |
    Открыта страница каталога товаров.
  test-data: |
    Производитель = "Apple"
  steps:
    - В блоке фильтров выбрать бренд "Apple"
  expected-result: |
    В каталоге отображаются товары только от производителя "Apple"

- summary: |
    Проверка фильтрации товаров по диапазону цен
  requirement: |
    В каталоге должна работать фильтрация товаров по цене
  prerequisites: |
    Открыта страница каталога товаров.
  test-data: |
    Минимальная цена = 1000, Максимальная цена = 5000
  steps:
    - Ввести в поле "Цена от" значение 1000
    - Ввести в поле "Цена до" значение 5000
  expected-result: |
    В каталоге отображаются только те товары, цена которых находится в диапазоне от 1000 до 5000 включительно

- summary: |
    Проверка фильтрации товаров по наличию
  requirement: |
    В каталоге должна работать фильтрация товаров по наличию
  prerequisites: |
    Открыта страница каталога товаров.
  test-data: |
    Чекбокс = "В наличии"
  steps:
    - Активировать чекбокс "В наличии" в блоке фильтров
  expected-result: |
    Из списка товаров в каталоге скрылись все позиции, которых нет на складе (статусы "Нет в наличии" / "Под заказ")

- summary: |
    Проверка перехода на страницу товара и отображения хэштега
  requirement: |
    На странице товара должен отображаться хэштег с переходом в категорию
  prerequisites: |
    Открыта страница каталога товаров.
  test-data: |
    Товар = "Смартфон X", Категория = "Электроника"
  steps:
    - Кликнуть на карточку товара "Смартфон X" в каталоге
    - Проверить наличие хэштега на открывшейся странице товара
  expected-result: |
    Открылась детальная страница товара. На странице отображается хэштег (ссылка) "#Электроника"

- summary: |
    Проверка перехода в категорию по клику на хэштег со страницы товара
  requirement: |
    На странице товара есть хэштег с переходом в категорию
  prerequisites: |
    Открыта детальная страница товара "Смартфон X".
  test-data: |
    Хэштег = "#Электроника"
  steps:
    - Кликнуть по хэштегу "#Электроника" на странице товара
  expected-result: |
    Произошел переход в каталог товаров. Автоматически применился фильтр по категории "Электроника"

- summary: |
    Добавление одного товара в корзину из каталога
  requirement: |
    Пользователь будет добавлять товар в корзину и продолжать выбирать товары в каталоге без перезагрузки страницы
  prerequisites: |
    Открыта страница каталога товаров. Корзина пуста. Открыта вкладка DevTools -> Network.
  test-data: |
    Товар = "Смартфон X"
  steps:
    - Нажать кнопку "В корзину" на карточке товара "Смартфон X"
    - Проверить изменения на странице и в DevTools
  expected-result: |
    Появляется всплывающее уведомление об успешном добавлении. Счетчик корзины в шапке равен 1. Страница не перезагрузилась. В DevTools зафиксирован запрос добавления со статусом 200 OK.

- summary: |
    Добавление нескольких одинаковых товаров в корзину
  requirement: |
    Система должна корректно суммировать количество одинаковых товаров при повторном добавлении
  prerequisites: |
    Открыта страница каталога товаров. Корзина пуста.
  test-data: |
    Товар = "Смартфон X", Количество = 3
  steps:
    - Нажать кнопку "В корзину" на карточке товара "Смартфон X" 3 раза подряд
    - Перейти на страницу корзины
  expected-result: |
    Счетчик в шапке показывает "3". На странице корзины товар "Смартфон X" отображается одной строкой, поле количества равно 3, итоговая сумма пересчитана.

- summary: |
    Добавление нескольких разных товаров в корзину
  requirement: |
    Пользователь должен иметь возможность добавлять разные товары в корзину
  prerequisites: |
    Открыта страница каталога товаров. Корзина пуста.
  test-data: |
    Товар 1 = "Смартфон X", Товар 2 = "Наушники Y"
  steps:
    - Нажать кнопку "В корзину" на карточке "Смартфон X"
    - Нажать кнопку "В корзину" на карточке "Наушники Y"
    - Перейти на страницу корзины
  expected-result: |
    Счетчик в шапке показывает "2". В корзине отображаются два разных товара отдельными строками.

- summary: |
    Удаление товара из корзины
  requirement: |
    На странице корзины пользователь cможет удалить товар из корзины. Стоимость корзины пересчитывается без перезагрузки.
  prerequisites: |
    В корзину добавлены "Смартфон X" (45000 руб.) и "Наушники Y" (5000 руб.). Открыта страница корзины. Открыта вкладка DevTools.
  test-data: |
    Товар для удаления = "Наушники Y"
  steps:
    - Нажать кнопку удаления ("крестик" / "иконка урны") напротив товара "Наушники Y"
    - Проверить изменения на странице и в DevTools
  expected-result: |
    Товар "Наушники Y" исчезает из списка. Общая сумма корзины мгновенно становится равной "45 000". Перезагрузки страницы не происходит. Запрос в DevTools вернул статус 200 OK.

- summary: |
    Проверка навигации «Продолжить выбирать товары» из корзины
  requirement: |
    На странице корзины пользователь cможет продолжить выбирать товары в каталоге. Корзина хранится в сессии.
  prerequisites: |
    В корзину добавлен товар "Смартфон X". Пользователь находится на странице корзины.
  test-data: |
    Кнопка = "Продолжить покупки"
  steps:
    - Нажать кнопку "Продолжить покупки" в интерфейсе корзины
  expected-result: |
    Система перенаправляет пользователя обратно в каталог товаров. Счетчик корзины по-прежнему отображает "1" (данные сохранены в сессии).

- summary: |
    Оформление заказа и переход на страницу оплаты (Проверка ФТ)
  requirement: |
    На странице корзины пользователь cможет оформить заказ с переходом на страницу оплаты
  prerequisites: |
    В корзину добавлен товар. Открыта страница корзины.
  test-data: |
    Кнопка = "Оформить заказ"
  steps:
    - Нажать кнопку "Оформить заказ" в корзине
  expected-result: |
    Происходит успешный редирект (переход) на защищенную целевую страницу оплаты заказа. 
    (Примечание: если страница не создана разработчиками — тест-кейс падает со статусом FAIL).

- summary: |
    Закрытие окна оформления заказа / Возврат из страницы оплаты
  requirement: |
    При отмене оформления заказа пользователь должен вернуться в корзину с сохранением товаров
  prerequisites: |
    Пользователь нажал "Оформить заказ" и перешел на страницу оплаты/оформления. Товары находятся в сессии.
  test-data: |
    Действие = Клик по кнопке "Назад" в браузере или кнопке "Отмена" на форме
  steps:
    - Нажать кнопку "Назад" в браузере (или "Отмена" на форме оформления)
  expected-result: |
    Пользователь возвращается на страницу корзины. Все добавленные ранее товары сохранены в списке, корзина не очистилась.

- summary: |
    Навигация по страницам каталога (Пагинация)
  requirement: |
    В каталоге должна работать навигация по страницам без сброса фильтров
  prerequisites: |
    В каталоге выбрана категория "Электроника" (товаров больше, чем на 1 страницу). Открыта 1-я страница каталога.
  test-data: |
    Номер страницы = 2
  steps:
    - Прокрутить страницу вниз и нажать на кнопку страницы "2" в блоке пагинации
  expected-result: |
    Загружается вторая страница товаров. Фильтр по категории "Электроника" остается активным.

- summary: |
    Изменение языка интерфейса сайта
  requirement: |
    Система должна поддерживать переключение языков интерфейса без потери данных корзины
  prerequisites: |
    В корзину добавлен товар. Открыта страница каталога. Текущий язык — Русский.
  test-data: |
    Язык = "English"
  steps:
    - Найти переключатель языков в шапке или футере сайта
    - Выбрать язык "English"
  expected-result: |
    Интерфейс сайта (кнопки, названия фильтров, меню) перевелся на английский язык. Счетчик корзины в шапке по-прежнему отображает добавленный товар.

- summary: |
    Проверка работы корзины в разных браузерах и на мобильных устройствах (Кроссплатформенность)
  requirement: |
    Интерфейс и функции корзины должны корректно работать в разных браузерах и на мобильных устройствах
  prerequisites: |
    Доступны браузеры Chrome, Safari, Firefox, Edge и мобильное устройство.
  test-data: |
    Браузеры = [Chrome, Safari, Firefox, Edge, Mobile Chrome/Safari]
  steps:
    - Открыть сайт поочередно в каждом целевом браузере и на мобильном телефоне
    - Выполнить добавление товара в корзину и перейти в корзину
  expected-result: |
    Верстка страниц каталога и корзины отображается корректно, элементы не накладываются друг на друга.Кнопки добавления и удаления кликабельны, функционал полностью работает на всех платформах.

- summary: |
    Техническая проверка запросов и ответов сервера через DevTools
  requirement: |
    Все критические действия пользователя не должны вызывать ошибок в консоли и сети (Network)
  prerequisites: |
    Открыта главная страница сайта. Открыта панель DevTools (F12), вкладки "Console" и "Network".
  test-data: |
    Действия = [Применение фильтров, Добавление товара, Переход в корзину, Удаление товара]
  steps:
    - Последовательно выполнить применение любого фильтра, добавление товара в корзину и его удаление
    - Изучить логи во вкладках Network и Console в DevTools
  expected-result: |
    Все уходящие XHR/Fetch запросы возвращают HTTP-статус 200 OK (или 201).
  prerequisites: |
    Во вкладке Console отсутствуют ошибки со статусами 4xx, 5xx, а также критические JavaScript-ошибки (Uncaught TypeError/ReferenceError).
