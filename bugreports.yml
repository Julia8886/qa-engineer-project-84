- summary: |
    В каталоге товаров у позиций без скидки отображается пустой бэйдж «%» и дублируется зачеркнутая старая цена
  environment: |
    Safari Версия 26.3 (20623.2.7.18.1); Google Chrome Версия: 146.0.7680.153 (официальная 
    сборка)(arm64); Firefox  Версия 149.0.2 (aarch64); macOS Sequoia 15.7.4
  steps-to-reproduce: |
    1.Авторизоваться на тестовом стенде под любым пользователем.
    2.Перейти в каталог товаров по ссылке: https://products-store.hexlet.app/
    3.Найти в списке товар без действующей скидки (например, "Apple Airpods" ).
    4.Посмотреть на блок стоимости и маркетинговых бэйджей в карточке этого товара.Ошибка визуально заметна на шаге 4.
  expected-result: Элементы скидки скрыты. Отображается только одна актуальная цена (например, «5000 руб.») 
    стандартным черным шрифтом без зачеркиваний. Пустой бэйдж процента отсутствует.
  actual-result: |
    Рядом с актуальной ценой выводится зачеркнутая цена с тем же значением («5000 руб»). 
    В углу карточки отображается пустой красный бэйдж со знаком «%» без числового значения.

- summary: |
    Клик по хештегу категории на странице товара не выполняет переход в категорию (ошибка 404 или отсутствие реакции)
  environment: |
    Safari Версия 26.3 (20623.2.7.18.1); Google Chrome Версия: 146.0.7680.153 (официальная 
    сборка)(arm64); Firefox  Версия 149.0.2 (aarch64); macOS Sequoia 15.7.4
  steps-to-reproduce: |
    1.Открыть главную страницу сайта. Перейти на карточку любого товара (например,"Apple Airpods").
    2.Проскроллить страницу до блока с хештегами категорий (под описанием товара).
    3.Кликнуть по любому активному хештегу (например, #Электроника).Ошибка происходит на шаге 4 при попытке совершить переход.
  expected-result: Пользователь успешно перенаправляется на страницу соответствующей категории каталога. 
    Страница загружается корректно.
  actual-result: |
    После клика по хештегу открывается пустая страница с ошибкой «404 Not Found» (или URL в адресной строке не меняется,
    и переход не происходит).

- summary: |
    Блокировка оформления заказа при переходе на страницу оплаты (ошибка 500 или бесконечная загрузка)
  environment: |
    Safari Версия 26.3 (20623.2.7.18.1); Google Chrome Версия: 146.0.7680.153 (официальная 
    сборка)(arm64); Firefox  Версия 149.0.2 (aarch64); macOS Sequoia 15.7.4
  steps-to-reproduce: |
    1.Авторизоваться на сайте и добавить любой товар в корзину.
    2.Перейти в корзину и нажать кнопку «Перейти к оформлению».
    3.Заполнить все обязательные поля (ФИО, телефон, адрес доставки).
    4.Выбрать способ оплаты «Банковская карта онлайн» и нажать кнопку «Оформить заказ».Ошибка происходит на шаге 4 при попытке перенаправления на платежный шлюз.
  expected-result: Заказ успешно создается в системе. 
    Происходит автоматический переход на внешнюю страницу для оплаты (ввода данных карты).
  actual-result: |
    Кнопка «Оформить заказ» переходит в состояние загрузки, переход не происходит. 
    В консоли браузера фиксируется ошибка «500 Internal Server Error» (или страница зависает).

- summary: |
    Некорректный статус-код (502 Bad Gateway) и отсутствие тела ответа в API-запросе GET /api/v1/products/123 в DevTools
  environment: |
    Safari Версия 26.3 (20623.2.7.18.1); Google Chrome Версия: 146.0.7680.153 (официальная 
    сборка)(arm64); Firefox  Версия 149.0.2 (aarch64); macOS Sequoia 15.7.4
  steps-to-reproduce: |
    1.Открыть браузер Google Chrome, нажать F12 и перейти на вкладку "Network" (Сеть).
    2.Включить фильтр по типу запросов "Fetch/XHR".
    3.Перейти на страницу товара ("Apple Airpods").
    4.Найти в списке запросов отправленный метод GET /api/v1/products/123 и кликнуть по нему.Ошибка валидации параметров запроса/ответа фиксируется на шаге 4.
  expected-result: Запрос завершается со статус-кодом 200 OK. 
    Вкладка "Response" содержит валидный JSON-объект с полными данными о товаре (id, name, price, description). 
    Время ответа сервера (Time) не превышает 500 мс.
  actual-result: |
    Запрос завершается со статус-кодом 502 Bad Gateway (или 400 Bad Request). 
    Вкладка "Response" пуста или содержит ошибку проксирования Nginx. Время ожидания ответа (TTFB) составляет более 3000 мс.

- summary: |
    Фильтрация товаров в каталоге применяется только к текущей странице пагинации, а не ко всему списку товаров категории
  environment: |
    Safari Версия 26.3 (20623.2.7.18.1); Google Chrome Версия: 146.0.7680.153 (официальная 
    сборка)(arm64); Firefox  Версия 149.0.2 (aarch64); macOS Sequoia 15.7.4
  steps-to-reproduce: |
    1.Перейти в любую категорию каталога с большим количеством товаров и пагинацией (например, где доступно 5 страниц).
    2.Переключиться на страницу 2 или 3 в блоке пагинации внизу списка.
    3.В блоке фильтров выбрать любой параметр (например, Бренд: Apple или диапазон цены), который гарантированно содержит товары на других страницах.
    4.Нажать кнопку «Применить» (или дождаться автоматической фильтрации).Ошибка логики фильтрации фиксируется на шаге 4.
  expected-result: Выбранный фильтр применяется ко всей базе данных товаров текущей категории. 
    Сбрасывается пагинация на страницу 1, и отображаются абсолютно все товары категории, соответствующие выбранному параметру.
  actual-result: |
    Фильтр ищет совпадения только среди товаров, которые были отображены на текущей открытой странице. 
    Количество страниц пагинации не пересчитывается, а товары с других страниц (подходящие под критерии) полностью игнорируются.

- summary: |
    Изменение языка интерфейса сайта сбрасывается или применяется частично при переходе на другие страницы.
  environment: |
    Safari Версия 26.3 (20623.2.7.18.1); Google Chrome Версия: 146.0.7680.153 (официальная 
    сборка)(arm64); Firefox  Версия 149.0.2 (aarch64); macOS Sequoia 15.7.4
  steps-to-reproduce: |
    1.Открыть главную страницу сайта (язык по умолчанию — Русский).
    2.В шапке (header) или (footer) сайта найти переключатель языков и выбрать другой язык (например, English).
    3.Проверить смену языка на текущей странице, а затем кликнуть на любой раздел меню (например, перейдя в «Каталог»).
    4.Ошибка локализации фиксируется на шагах 2 или 3.
  expected-result: Весь текстовый контент (интерфейс, меню, кнопки, системные сообщения) полностью переводится на выбранный язык. 
    Выбранная локаль (например, /en/ в URL) и языковая кука (cookie) сохраняются при переходе между всеми страницами сайта.
  actual-result: |
    После смены языка часть элементов (например, кнопки меню или футер) остаются на русском языке. 
    При переходе на любую другую страницу сайта выбранный язык полностью сбрасывается обратно на русский.

- summary: |     
    В мобильной версии Safari на iOS кнопка «Оформить заказ» смещается за пределы экрана и становится некликабельной (проблема кроссбраузерности/адаптивности)
  environment: |
    Safari Версия 26.3 (20623.2.7.18.1); Google Chrome Версия: 146.0.7680.153 (официальная 
    сборка)(arm64); Firefox  Версия 149.0.2 (aarch64); macOS Sequoia 15.7.4
  steps-to-reproduce: |
    1.Открыть сайт в браузере Safari на мобильном устройстве (iOS).
    2.Добавить любой доступный товар в корзину из каталога.
    3.Нажать на иконку корзины в шапке сайта для перехода на страницу корзины.
    4.Проскроллить страницу корзины вниз до итогового блока стоимости заказа.Ошибка верстки и функционала фиксируется на шаге 4.
  expected-result: Интерфейс корзины корректно адаптируется под размер экрана смартфона. 
    Блок «Итого» и кнопка «Перейти к оформлению» полностью видны, находятся в зоне видимости и кликабельны.
  actual-result: |
    Элементы корзины накладываются друг на друга. Нижний блок с ценой и кнопка «Перейти к оформлению» 
    уходят под нижнюю системную панель навигации Safari, из-за чего нажать на кнопку невозможно.
    


    




