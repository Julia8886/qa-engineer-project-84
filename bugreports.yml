---
- summary: |
    Кнопка "В корзину" вылезает за пределы контейнера
  environment: |
    Safari Версия 26.3 (20623.2.7.18.1); Google Chrome Версия: 146.0.7680.153 (официальная сборка)(arm64);macOS Sequoia 15.7.4
  steps-to-reproduce: |
    1.Открыть главную страницу сайта https://products-store.hexlet.app/
    2.Посмотреть на кнопку "В корзину" в нижней части карточки товара.
  expected-result: Кнопка "В корзину" находится внутри контейнера карточки товара,
    не перекрывает соседние элементы и не выходит за нижнюю границу карточки.
  actual-result: |
    Кнопка "В корзину" выходит за границы карточки товара на странице каталога.
    
- summary: |
    Неровное отображение количества товара в карточках (разный отступ)
  environment: |
    Safari Версия 26.3 (20623.2.7.18.1); Google Chrome Версия: 146.0.7680.153 (официальная
    сборка) (arm64); Firefox  Версия 149.0.2 (aarch64); macOS Sequoia 15.7.4
  steps-to-reproduce: |
    1.Открыть главную страницу сайта https://products-store.hexlet.app/
    2.Добавить товары в корзину (несколько разных)
    3.Посмотреть на количество единиц каждого товара
  expected-result: Все элементы количества единиц во всех карточках товаров
    выровнены по одной сетке и имеют одинаковые отступы.
  actual-result: |
    Счетчик количества ("1 шт.") находится на разном расстоянии от
    названия товара     

- summary: |
    В каталоге товаров у позиций без скидки отображается пустой бэйдж «%» и дублируется зачеркнутая старая цена
  environment: |
    Safari Версия 26.3 (20623.2.7.18.1); Google Chrome Версия: 146.0.7680.153 (официальная 
    сборка)(arm64); Firefox  Версия 149.0.2 (aarch64); macOS Sequoia 15.7.4
  steps-to-reproduce: |
    1.Авторизоваться на тестовом стенде под любым пользователем.
    2.Перейти в каталог товаров по ссылке: https://products-store.hexlet.app/
    3.Найти в списке товар без действующей скидки (например, "Apple Airpods" ).
    4.Посмотреть на блок стоимости и маркетинговых бэйджей в карточке этого товара.Ошибка визуально заметна на шаге 4.
  expected-result: Элементы скидки скрыты. Отображается только одна актуальная цена (например, «5000 руб.») 
    стандартным черным шрифтом без зачеркиваний. Пустой бэйдж процента отсутствует.
  actual-result: |
    Рядом с актуальной ценой выводится зачеркнутая цена с тем же значением («5000 руб»). 
    В углу карточки отображается пустой красный бэйдж со знаком «%» без числового значения.
