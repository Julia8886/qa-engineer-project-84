bugreports:
  - summary: |
      Кнопка "В корзину" вылезает за пределы контейнера
    environment: |
      Safari Версия 26.3 (20623.2.7.18.1); Google Chrome Версия: 146.0.7680.153 (официальная сборка) (arm64); macOS Sequoia 15.7.4
    steps-to-reproduce: |
      1.Открыть главную страницу сайта https://products-store.hexlet.app/
      2.Посмотреть на кнопку "В корзину" в нижней части карточки товара.
    expected-result: | 
      Кнопка "В корзину" находится внутри контейнера карточки товара,не перекрывает соседние элементы и не выходит за нижнюю границу карточки.
    actual-result: |
       Кнопка "В корзину" выходит за границы карточки товара на странице каталога.
       
  - summary: |
       В карточке товара описание товара на английском языке
    environment: |
       Safari Версия 26.3 (20623.2.7.18.1);Firefox  Версия 149.0.2 (aarch64); Google Chrome Версия: 146.0.7680.153 (официальная сборка) (arm64); macOS Sequoia 15.7.4
    steps-to-reproduce: |
      1.Открыть главную страницу сайта https://products-store.hexlet.app/
      2.Нажать на кнопку выбор языка
      3.Выбрать любой язык кроме английского
      4.Посмотреть на карточки товаров описание товаров
    expected-result: |
      При выборе нужного языка, в правом верхнем углу, на главной странице магазина, в карточках товара, описание товара меняется на выбранный язык
    actual-result: |
       В карточках товара, описание товара при выборе языка, не  изменяется(только английский)
       
  - summary: |
       В Форме "Заказ успешно оформлен" неровное отображение единиц товара
    environment: |
       Safari Версия 26.3 (20623.2.7.18.1);Firefox  Версия 149.0.2 (aarch64); Google Chrome Версия: 146.0.7680.153 (официальная сборка) (arm64); macOS Sequoia 15.7.4
    steps-to-reproduce: |
      1.Выбрать не менее 3 разных позиций товаров 
      2.Перейти в корзину товаров
      3.Нажать кнопку "Оформить заказ"
      4.Посмотреть на "Форму отправки заказа" количество единиц товара
    expected-result: | 
      Все элементы количества единиц во всех карточках товароввыровнены по одной сетке и имеют одинаковые отступы.
    actual-result: |
       Счетчик количества ("1 шт.") находится на разном расстоянии от названия товара 
       
  - summary: |
       В корзине товаров кнопка "Удалить" находиться на разном расстояние от названия товара
    environment: |
       Safari Версия 26.3 (20623.2.7.18.1); Google Chrome Версия: 146.0.7680.153 (официальная сборка) (arm64); macOS Sequoia 15.7.4
    steps-to-reproduce: |
      1.Выбрать несколько товаров
      2.Перейти в корзину
      3.Посмотреть в корзине выбранные товары на кнопку "Удалить"
    expected-result: |
      Все кнопки "Удалить" выровнены во всех карточках товаров иимеют одинакоые отступы
    actual-result: |
       Кнопка "Удалить" находиться на разном расстоянии от названия товара
       
  - summary: |
       После оформления заказа в форме не отображается "Спасибо за заказ" и номер заказа
    environment: |
       Safari Версия 26.3 (20623.2.7.18.1); Google Chrome Версия: 146.0.7680.153 (официальная сборка) (arm64); macOS   Sequoia 15.7.4
    steps-to-reproduce: |
      1.Оформить заказ
      2.Отправить заказ в "форме заказа"
      3.Посмотреть на обратную "форму заказа"
    expected-result: |
      При оформлении заказа ,приходит обратная форма "Спасибо зазаказ" и номер заказа
    actual-result: |
      После оформления заказа в форме не отображается "Спасибо зазаказ" и номер заказа.



